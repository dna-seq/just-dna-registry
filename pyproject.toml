[project]
name = "just-dna-registry"
version = "0.19.0"
description = "Reference client (and optional server) for the just-dna annotation module registry"
readme = "README.md"
requires-python = ">=3.13"
# Default install = the reference client only (lightweight: httpx + the `just-dna-format` contract).
# The tiers mirror just-dna-format's own (CONSTITUTION Goal 2): format is pydantic+cryptography,
# `compiler` adds polars/pyyaml/typer, `server` adds the network tier on top. A verify-only or
# download-only client pulls none of it.
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.26.8",
    "python-dotenv>=1.0.1",
    # **0.6.0 is a hard floor on the base install**, which no previous adoption needed. Through 0.5.x
    # the client read only models that had existed since 0.3, so the floor could stay at 0.5.0 and let
    # a 0.5.0 client talk to a 0.5.4 server. 0.6 ends that: `just_dna_format.layout` (the four-party
    # sidecar-name agreement `specfiles.py` is now built on) and the `readme` / `verification` /
    # `weighting` / `gwas_effects` manifest blocks are all new symbols, read unguarded, on the client
    # path as well as the server one.
    #
    # And a floor is the *weaker* of the two guards here. `version.contract_compatible` treats a 0.x
    # MINOR as a breaking contract bump, so a 0.5 client is refused by a 0.6 server before any import
    # error could occur — the floor exists so the failure is a resolver message rather than an
    # `AttributeError` deep inside a download.
    #
    # **`.1`, not `.0`, and this one is about `content_signature`.** Upstream RM95: a closed
    # vocabulary is meant to accept `-` for `_` and store the canonical member, and
    # `MeasureBinRow._validate_measure_kind` stored the input instead — so `measure_kind=copy-number`
    # went into `content_signature` as a value the vocabulary does not contain, and every subclass then
    # refused what the base model had just accepted. A signature is this service's one permanent global
    # claim (a `409 duplicate_content` slot only a purge frees), so a floor below the fix is a floor
    # that lets one be minted over a spelling upstream calls invalid. Same cut, no contract change:
    # 0.6.1 moves no schema surface and recompiles all sixteen reference examples byte-identical.
    "just-dna-format>=0.6.1",
]

[project.optional-dependencies]
# Client-side spec inspection: `RegistryClient.content_signature()` / `registry-client signature`
# compute a spec's content identity locally, without uploading and without recompiling, so a
# publisher can pre-check dedup before spending a publish. Only the compiler tier is needed for
# that — no network tier, no FastAPI.
# `>=0.5.1` for the public `load_csv_rows` / `load_spec_variants` (RM41), then `>=0.5.4` for
# `compiler.UNJOINABLE_PHRASE`. Floor is now **0.6.0**, and unlike the 0.5.x bumps this one is a
# contract cut rather than an attribute chase: 0.6 moves `artifact.digest` on every module, so a 0.5
# compiler computing a signature beside a 0.6 server is computing it under a different parquet schema.
#
# `ARTIFACT_PARQUETS` / `LEAD_PARQUETS` (the public names for what was `_OUTPUT_FILES`) are the
# concrete new imports; the floor would be here for the digest window regardless.
#
# **0.6.1 raises it one patch, for what `validate_spec` does.** RM93: two table-level checks ran on the
# compile side and not in `validate_spec`, so `validate --strict` could pass a spec `compile --strict`
# then refused — a module with `frequencies.csv`, or a table-only module with `studies.csv`. Both
# endpoints this repo built for CI (`/validate`, `/check`) are pre-flights for the publish compile, and
# S6's rule is that a read-only pre-flight must predict the operation it precedes. On 0.6.0 they could
# not, for those two shapes.
compiler = [
    "just-dna-compiler>=0.6.1",
]
# Everything needed to RUN the registry: FastAPI app, server-side enrich+recompile, storage, admin
# CLI. `just-dna-enricher` is the only tier permitted to fetch (CONSTITUTION Principle 2); it lives
# here rather than in the base deps so a client install pulls no duckdb / ga4gh-vrs / HuggingFace.
server = [
    "fastapi>=0.139.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.9",
    "eliot>=1.17.5",
    "huggingface-hub>=0.34.0",
    "pyjwt>=2.10.0",
    "pyyaml>=6.0.2",
    # `>=0.6.0` is a hard floor, and the reason differs in kind from every floor before it. The 0.5.x
    # bumps were each an attribute that did not exist on the release below (`.vrs`, RM40, 0.5.1;
    # `.clin_sig_not_checked`, S4, 0.5.2; `offline=` on the dosage pass, RM39, 0.5.1;
    # `cpic_cache`/`pharmvar_cache` on `enrich_pgx`, RM38, 0.5.1; `EnrichmentResult.unreachable_rsids`,
    # S20, 0.5.4; `IdentifierReport.gene_loci` / `.gene_loci_not_checked`, S24, 0.5.4). Those are still
    # true and still read unguarded.
    #
    # 0.6 adds a second, stronger reason: it is a **contract** boundary. Every `artifact.digest` this
    # server publishes moves, so the compiler that computes one and the format that models it must be
    # the same minor as the clients verifying it — which `version.contract_compatible` enforces on the
    # wire, and this floor enforces at install time. Running a 0.5 compiler here would publish digests
    # no 0.6 client can reproduce.
    #
    # Concrete new reads on top of the digest window: `compiler.ARTIFACT_PARQUETS` / `LEAD_PARQUETS`,
    # `Compilation.resolution_subjects` and the four positional/expansion counters (RM44 — what
    # finally retires the warning-prose coupling in `db/facets.py`), `manifest.readme` (S25),
    # `manifest.verification` / `weighting` / `gwas_effects`, and the enricher's three new drafting
    # passes behind the fact tables `specfiles.py` now recognizes.
    #
    # **0.6.1 on both, and on the enricher it is the one floor here that fixes behaviour we relied on
    # rather than a symbol we import.** Three of its four network-tier items land on paths this server
    # runs: RM97 — `gnomad` and `eutils` leaked raw `httpx` past handlers written for the tier's own
    # error types, which is what made `services/enrich.py`'s per-pass adapters miss a 5xx (fixed on our
    # side too, since the pass functions let the *client's* type through either way); RM98 — an
    # `--offline` pass with no cache recorded `status="not_found"`, a definite negative nobody
    # established, against the rule this repo states as "a pass that could not run never reports
    # clean"; RM99 — three passes wrote their sidecar to the spec root regardless of layout, so an
    # `enrich` run against a `derived/` tree could leave both copies, which `layout.resolve_sidecar`
    # then refuses as a collision our own upload caused.
    #
    # **The enricher goes to 0.6.2 alone, and it is a hard floor for the opposite of the usual reason:
    # not a symbol that is missing below it, but one whose *meaning changes at* it.** 0.6.2 is RM101,
    # which is our own S37 answered — every pass now raises its own error type rather than its
    # client's, with "the source could not be reached" as a **subclass** (`FrequencyUnavailable` and
    # five siblings). Our adapters catch the subclass arm first, so on 0.6.1 those arms are dead code:
    # the pass raises the client's type, no arm matches, and `/check` 500s again — the exact defect
    # this floor's predecessor was raised to fix. Running 0.6.1 here would silently reinstate it.
    # `just-dna-format` and `just-dna-compiler` did *not* move and stay at 0.6.1; this is a partial cut
    # and upgrading all three in step would be wrong.
    #
    # **0.6.3 is a third partial cut, and the floor is hard for a third distinct reason: an argument we
    # already pass changes from inert to real.** Most of that release is upstream's ClinVar and ClinPGx
    # *drafters* (S41, S44), which this service does not have and never calls — drafting is
    # authoring-side, so none of it reaches an endpoint here. The one item that does is S39:
    # `load_dotenv_file` had reached none of the six cache resolvers, because each passed its
    # `default_*_cache_dir()` as an argument and `_cache_dir` loaded the `.env` unconditionally. From
    # 0.6.3 the flag is threaded through and works. `services/enrich.available_references` had passed
    # `False` since it was written, so on 0.6.3 *keeping* it would have been the behaviour change — a
    # reporting caller that stops reading the `.env` while `enrich()`, which calls the same resolvers
    # with the default, goes on reading it. The flag is dropped rather than the floor left at 0.6.2:
    # both versions then behave identically here, and a deployment that installs 0.6.2 anyway gets the
    # same answer from the same code. The floor moves regardless so the pair is impossible to
    # mis-assemble, and because 0.6.2's own hard reason (the unavailability subclasses) is unaffected.
    #
    # **0.6.4 is the first floor in this file that is NOT hard, and saying so is the point of the
    # paragraph.** Every one above it was forced by something: a symbol that did not exist, a subclass
    # whose meaning changed, an argument that went from inert to live. 0.6.4 is none of those. It is a
    # single fix inside `clinvar_draft.py` (upstream S45) adding one private helper, in the ClinVar
    # **drafter** — authoring-side code this service does not have and never calls. No public symbol
    # moves, no pass this server runs behaves differently, and a deployment left on 0.6.3 loses
    # nothing here.
    #
    # It moves for two reasons that are about assembly rather than function. The lock resolves 0.6.4
    # (the `>=0.6.3` constraint picked it up on the next relock), and the suite gating this release
    # ran on exactly `0.6.1 / 0.6.1 / 0.6.4` — so a floor left at 0.6.3 would permit a trio nobody
    # tested while shipping a lock for one we did. And 0.18.2's release note corrects advice this
    # project published about re-drafting; a notice needs a version to point at.
    #
    # Worth preserving rather than flattening: a reader who treats every floor here as load-bearing
    # will not question the next one either, and the reason the 0.6.2 and 0.6.3 comments run long is
    # that both were easy to mistake for optional. This one genuinely is optional.
    "just-dna-compiler>=0.6.1",
    "just-dna-enricher>=0.6.4",
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

# Defensive: never let secrets / editor junk into the sdist or wheel, regardless of what the
# default inclusion picks up. (The default already ships only src/ + metadata.)
[tool.uv.build-backend]
source-exclude = [".env", ".env.*", "*.swp", "*.swo", "*.swn", ".*.swp"]
wheel-exclude = [".env", ".env.*", "*.swp", "*.swo", "*.swn", ".*.swp"]

[project.scripts]
# Client CLI works on the default install; the server admin CLI needs the `server` extra.
registry-client = "just_dna_registry.client_cli:app"
registry = "just_dna_registry.cli:app"

[dependency-groups]
dev = [
    "just-dna-registry[server]",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
# `auto` so `async def test_*` run without a per-test marker (used by the client SDK suite, which
# bridges the sync client onto a worker thread while the ASGI app is driven in-process).
asyncio_mode = "auto"

[tool.ruff]
# Mirrors `just-dna-format`'s section, deliberately: the two repos are edited in the same sitting by
# the same people, and a rule that fires upstream but not here (or the reverse) turns a lint run into
# a question about which checkout you are standing in. Adopt upstream's changes to this block rather
# than diverging locally; the three adaptations below are the only intended differences.
#
# Every member pins `requires-python = ">=3.13"`. Saying so here is load-bearing: the rules that offer
# a modern spelling (PEP 604 `X | None`) resolve against the floor, not against whichever interpreter
# runs.
target-version = "py313"
# Not enforced as a lint (E501 is deliberately unselected) — this is what `ruff format` would wrap to,
# and it matches the prose-heavy docstrings and long diagnostic strings the codebase actually has.
line-length = 110
# **Adaptation 1.** `.claude/` holds the triage-loop scripts, which are a copy of the published gist
# with `INBOX` repointed (see CLAUDE.md). Sync is one-way and by hand, so a `--fix` that reformatted
# them here would silently fork the pattern from its canonical copy.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle, minus the purely-formatting opinions
    "F",                # pyflakes
    "I",                # import order — "absolute imports only" is a house rule; this keeps it stable
    "UP",               # pyupgrade. The floor is 3.13, so the modern spelling is always available
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM", "FURB", "PIE", "FLY",
]
ignore = [
    # Typer's entire API is `def cmd(x: T = typer.Option(...))`: the call in the default *is* the
    # declaration, and "Typer for every CLI" is a house rule, so there is no alternative spelling.
    # FastAPI's `Depends(...)` / `Query(...)` / `File()` defaults are the same shape, and this repo is
    # mostly FastAPI — `dependencies=[Depends(rate_limit("publish"))]` is on nearly every route.
    "B008",
]

# Deliberately NOT selected, so the reasons are recorded rather than rediscovered:
#   BLE001 — `except Exception` around a network call is this tier's contract, not a swallowed error.
#            Every site logs or records a finding. The handful that exist already carry an explanatory
#            `# noqa: BLE001 — …`, which is the convention to follow if a new one is genuinely right.
#   ISC004 — a long diagnostic written as one implicitly-concatenated f-string is the idiom of the
#            validation and enrichment reporters. Consistent and intentional.
#   E501   — see `line-length` above.
#   PLC0415 (import-outside-top-level) — "no inline imports" is a house rule, but the one deliberate
#            exception is load-bearing: `services/enrich.py` imports `just_dna_enricher` *inside* its
#            functions so the compile path cannot reach the network tier (CONSTITUTION Principle 2),
#            and a test asserts that boundary. Selecting this would flag the thing we require.

[tool.ruff.lint.per-file-ignores]
# **Adaptation 2.** Upstream's glob is `*/tests/*` for its three nested member packages; this repo's
# suite is a single top-level `tests/`, so the pattern has to be rooted here or it matches nothing.
# A test that asserts a bad row is rejected does not care which exception class carries the rejection —
# the point is that *something* refuses it.
"tests/*" = ["B017"]

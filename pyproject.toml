[project]
name = "just-dna-registry"
version = "0.16.0"
description = "Reference client (and optional server) for the just-dna annotation module registry"
readme = "README.md"
requires-python = ">=3.13"
# Default install = the reference client only (lightweight: httpx + the `just-dna-format` contract).
# The tiers mirror just-dna-format's own (CONSTITUTION Goal 2): format is pydantic+cryptography,
# `compiler` adds polars/pyyaml/typer, `server` adds the network tier on top. A verify-only or
# download-only client pulls none of it.
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.26.8",
    "python-dotenv>=1.0.1",
    "just-dna-format>=0.5.0",
]

[project.optional-dependencies]
# Client-side spec inspection: `RegistryClient.content_signature()` / `registry-client signature`
# compute a spec's content identity locally, without uploading and without recompiling, so a
# publisher can pre-check dedup before spending a publish. Only the compiler tier is needed for
# that — no network tier, no FastAPI.
# `>=0.5.1` for the public `load_csv_rows` / `load_spec_variants` (RM41). Floor is now **0.5.4**, for
# `compiler.UNJOINABLE_PHRASE`: `db/facets.py` imports it rather than spelling the fragment, so this is
# a hard floor and not a preference — on 0.5.3 the import is an `ImportError` at startup.
#
# `just-dna-format` stays at 0.5.0 on purpose, and 0.5.4 did not change that even though upstream
# bumped format to the shared number. That bump was for *legibility* — "a 0.5.4 compiler naming a 0.5.0
# schema is a version pair nobody can read" — not a schema cut: no model, parquet column or manifest
# field moved in 0.5.1→0.5.4, which is what kept them all legal inside the closed 0.5 digest window.
# `version.contract_compatible` says the same thing structurally (same major.minor interoperates), so a
# 0.5.0 client still exchanges artifacts with a 0.5.4 server and raising this floor would break that
# for nothing.
compiler = [
    "just-dna-compiler>=0.5.4",
]
# Everything needed to RUN the registry: FastAPI app, server-side enrich+recompile, storage, admin
# CLI. `just-dna-enricher` is the only tier permitted to fetch (CONSTITUTION Principle 2); it lives
# here rather than in the base deps so a client install pulls no duckdb / ga4gh-vrs / HuggingFace.
server = [
    "fastapi>=0.139.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.9",
    "eliot>=1.17.5",
    "huggingface-hub>=0.34.0",
    "pyjwt>=2.10.0",
    "pyyaml>=6.0.2",
    # `>=0.5.4` is a hard floor, not a preference. Each of these is read unguarded, and every one of
    # them is an attribute or a name that simply does not exist on the release below it: `.vrs` (RM40,
    # 0.5.1), `.clin_sig_not_checked` (S4, 0.5.2), `offline=` on the dosage pass (RM39, 0.5.1),
    # `cpic_cache`/`pharmvar_cache` on `enrich_pgx` (RM38, 0.5.1), `heteroplasmy.csv` in the enricher's
    # subject list (0.5.3), the positional-joinability warning the trust facet consults (0.5.3), and now
    # from 0.5.4: `EnrichmentResult.unreachable_rsids` (S20), `IdentifierReport.gene_loci` /
    # `.gene_loci_not_checked` (S24), and `compiler.UNJOINABLE_PHRASE` (S13).
    #
    # 0.5.4 also makes `PacingGate` thread-safe (S15), which is the one item here the registry does not
    # *read* — it repairs a race this server was the reported cause of, since a shared bundle across a
    # threadpool is exactly the arrangement the enricher's own docstring recommends. See
    # `services/enrich.py::shared_lookup_clients` and `enrich_max_concurrency` in `config.py`.
    "just-dna-compiler>=0.5.4",
    "just-dna-enricher>=0.5.4",
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

# Defensive: never let secrets / editor junk into the sdist or wheel, regardless of what the
# default inclusion picks up. (The default already ships only src/ + metadata.)
[tool.uv.build-backend]
source-exclude = [".env", ".env.*", "*.swp", "*.swo", "*.swn", ".*.swp"]
wheel-exclude = [".env", ".env.*", "*.swp", "*.swo", "*.swn", ".*.swp"]

[project.scripts]
# Client CLI works on the default install; the server admin CLI needs the `server` extra.
registry-client = "just_dna_registry.client_cli:app"
registry = "just_dna_registry.cli:app"

[dependency-groups]
dev = [
    "just-dna-registry[server]",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# `auto` so `async def test_*` run without a per-test marker (used by the client SDK suite, which
# bridges the sync client onto a worker thread while the ASGI app is driven in-process).
asyncio_mode = "auto"
